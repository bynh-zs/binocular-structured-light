name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install python-docx
      - name: Syntax check
        run: python -m compileall -q calc tools validation tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke run calc
        run: python calc/volume_budget.py --all
      - name: Smoke run validation
        run: python validation/analyze_validation.py validation/standard_parts_template.csv
